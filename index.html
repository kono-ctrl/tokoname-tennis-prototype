<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>株式会社ネクストコート 様｜常滑市 屋内テニス候補地マップ</title>
<style>
  :root {
    --bg: #f7f5f0;
    --panel: #ffffff;
    --panel-2: #faf8f3;
    --border: #e5e1d6;
    --gold: #b8944a;
    --gold-soft: #d9be7d;
    --text: #1a1a1a;
    --text-sub: #7a7468;
    --red: #c8553d;
    --blue: #4a6fa5;
    --header-bg: #14120f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: 'Helvetica Neue', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif; background: var(--bg); color: var(--text); }
  body { display: grid; grid-template-rows: auto 1fr; height: 100vh; overflow: hidden; }

  header {
    background: linear-gradient(180deg, #1a1815 0%, #14120f 100%);
    border-bottom: 1px solid var(--gold);
    padding: 18px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 10;
    position: relative;
  }
  header .brand-text h1 { color: #f5f2ea; }
  header .brand-text .sub { color: #a8a096; }
  header .header-meta { color: #a8a096; }
  header::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: -4px;
    height: 2px;
    background: linear-gradient(90deg, transparent 0%, var(--gold) 50%, transparent 100%);
    opacity: 0.4;
  }
  .brand { display: flex; align-items: center; gap: 22px; }
  .brand-logo {
    height: 32px;
    width: auto;
    display: block;
    content: url("assets/kumazawa-logo.jpg");
  }
  .brand-divider {
    width: 1px;
    height: 28px;
    background: var(--gold);
    opacity: 0.5;
  }
  .brand-text h1 {
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.08em;
    color: var(--text);
    line-height: 1.4;
  }
  .brand-text h1 .gold { color: var(--gold); font-weight: 600; }
  .brand-text .sub {
    font-size: 10px;
    color: var(--text-sub);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-top: 2px;
  }
  .header-meta {
    font-size: 10px;
    color: var(--text-sub);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    text-align: right;
  }
  .header-meta .line2 {
    display: block;
    font-size: 9px;
    color: var(--gold);
    margin-top: 2px;
    letter-spacing: 0.22em;
  }

  main { display: grid; grid-template-columns: 340px 1fr; overflow: hidden; }

  aside {
    background: var(--panel);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 22px 20px;
  }
  .aside-heading { font-size: 10px; color: var(--gold); letter-spacing: 0.2em; font-weight: 700; margin-bottom: 12px; }
  .aside-sub { font-size: 12px; color: var(--text-sub); margin-bottom: 20px; line-height: 1.8; }

  .site-card {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 14px 16px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: border-color 0.15s, transform 0.15s, box-shadow 0.15s;
  }
  .site-card:hover { border-color: var(--gold); transform: translateX(2px); box-shadow: 0 2px 8px rgba(184, 148, 74, 0.12); }
  .site-card.active { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold) inset, 0 2px 12px rgba(184, 148, 74, 0.18); }
  .site-card .num {
    display: inline-block;
    width: 22px; height: 22px;
    line-height: 22px; text-align: center;
    background: var(--gold); color: #fff;
    border-radius: 50%; font-weight: 700; font-size: 11px;
    margin-right: 8px;
  }
  .site-card .title { font-size: 13px; font-weight: 600; display: inline-block; vertical-align: middle; color: var(--text); }
  .site-card .meta { font-size: 11px; color: var(--text-sub); margin-top: 8px; line-height: 1.6; }
  .site-card .status {
    display: inline-block;
    font-size: 10px;
    padding: 2px 8px;
    background: var(--gold);
    color: #fff;
    border-radius: 2px;
    margin-top: 8px;
    letter-spacing: 0.1em;
    font-weight: 600;
  }

  #map { width: 100%; height: 100%; background: #e9e4d8; }

  /* InfoWindow内部スタイル（Google Maps default container覆い） */
  .gm-style .gm-style-iw-c {
    background: var(--panel) !important;
    border: 1px solid var(--gold) !important;
    border-radius: 6px !important;
    box-shadow: 0 12px 32px rgba(0,0,0,0.18) !important;
    padding: 0 !important;
    max-width: 380px !important;
  }
  .gm-style .gm-style-iw-d { overflow: hidden !important; padding: 0 !important; }
  .gm-style .gm-style-iw-tc::after { background: var(--panel) !important; border-top: 1px solid var(--gold); }

  .iw {
    color: var(--text);
    font-family: inherit;
    width: 340px;
  }
  .iw-photo {
    width: 100%; height: 160px;
    background: #000 center/cover no-repeat;
    border-bottom: 1px solid var(--gold);
  }
  .iw-body { padding: 14px 18px 18px; }
  .iw-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; color: var(--gold); }
  .iw-sub { font-size: 11px; color: var(--text-sub); margin-bottom: 12px; letter-spacing: 0.06em; }
  .iw-facts {
    display: grid; grid-template-columns: auto 1fr; gap: 4px 12px;
    font-size: 11px; line-height: 1.6;
    padding: 10px 0;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    margin-bottom: 12px;
  }
  .iw-facts dt { color: var(--text-sub); }
  .iw-facts dd { color: var(--text); font-weight: 500; }
  .iw-docs-label { font-size: 10px; color: var(--gold); letter-spacing: 0.2em; margin-bottom: 8px; }
  .iw-docs { list-style: none; }
  .iw-docs li { margin-bottom: 6px; }
  .iw-docs a {
    color: #1565c0; text-decoration: underline;
    font-size: 12px;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 0;
  }
  .iw-docs a:hover { color: #0d47a1; }
  .iw-docs a::before { content: "▸"; color: #1565c0; font-size: 10px; }
  .iw-zip {
    display: block;
    margin-top: 14px; padding: 8px 12px;
    background: var(--gold); color: #000;
    text-align: center; font-size: 11px; font-weight: 600;
    text-decoration: none; letter-spacing: 0.1em;
    border-radius: 2px;
  }
  .iw-zip:hover { background: var(--gold-soft); }

  .legend {
    position: absolute;
    bottom: 24px; left: 24px;
    background: rgba(255, 255, 255, 0.96);
    border: 1px solid var(--border);
    padding: 10px 14px;
    font-size: 11px;
    color: var(--text);
    border-radius: 4px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    display: flex; gap: 16px; align-items: center;
  }
  .legend .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }

  @media (max-width: 760px) {
    html, body { height: auto; min-height: 100%; }
    body { display: block; overflow: auto; }
    header { padding: 13px 14px; align-items: flex-start; }
    .brand { width: 100%; gap: 12px; align-items: flex-start; }
    .brand-logo { width: 132px; height: auto; flex: 0 0 auto; }
    .brand-divider, .header-meta { display: none; }
    .brand-text { min-width: 0; }
    .brand-text h1 { font-size: 12px; letter-spacing: .04em; line-height: 1.45; }
    .brand-text h1 .gold { display: block; }
    .brand-text .sub { display: none; }
    main { display: flex; flex-direction: column; overflow: visible; }
    aside { order: 1; overflow: visible; padding: 20px 16px; border-right: 0; border-bottom: 1px solid var(--border); }
    #map { order: 2; height: 68vh; min-height: 520px; }
    .legend { display: none; }
    .iw { width: min(290px, calc(100vw - 70px)); }
    .iw-photo { height: 135px; }
  }
</style>
</head>

        'background:#fff',
        'color:#dc2626',
        'border:2px solid #dc2626',
        'border-radius:4px',
        'padding:3px 10px',
        'font-size:11px',
        'font-weight:700',
        'white-space:nowrap',
        'box-shadow:0 2px 6px rgba(0,0,0,0.35)',
        'transform:translate(-50%, -34px)',
        'pointer-events:none',
        'letter-spacing:0.04em',
      ].join(';');

      class NameLabelOverlay extends google.maps.OverlayView {
        constructor(position, content) { super(); this.position = position; this.content = content; }
        onAdd() { this.getPanes().markerLayer.appendChild(this.content); }
        draw() {
          const proj = this.getProjection();
          if (!proj) return;
          const p = proj.fromLatLngToDivPixel(new google.maps.LatLng(this.position.lat, this.position.lng));
          this.content.style.position = 'absolute';
          this.content.style.left = p.x + 'px';
          this.content.style.top = p.y + 'px';
        }
        onRemove() { this.content.remove(); }
      }
      const overlay = new NameLabelOverlay({ lat: l.lat, lng: l.lng }, labelDiv);
      overlay.setMap(map);
    });

    renderSidebar();

    // HTMLメールなど外部導線から、該当候補地を直接開けるようにする。
    // 例: ?site=asukadai または #asukadai
    const params = new URLSearchParams(window.location.search);
    const requestedSite = params.get('site') || window.location.hash.replace(/^#/, '');
    if (requestedSite && sites.some(site => site.id === requestedSite)) {
      window.setTimeout(() => openSite(requestedSite), 250);
    }
  }

  function openSite(id) {
    // 他の InfoWindow を閉じる
    Object.values(infoWindows).forEach(iw => iw.close());
    const iw = infoWindows[id];
    const marker = markers[id];
    if (iw && marker) {
      iw.open({ anchor: marker, map });
      map.panTo(marker.getPosition());
    }
    document.querySelectorAll('.site-card').forEach(el => {
      el.classList.toggle('active', el.dataset.id === id);
    });
  }

  function renderInfoWindow(site) {
    const factsHtml = Object.entries(site.facts)
      .map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('');
    const docsHtml = site.docs
      .map(d => `<li><a href="${site.folder}/${d.file}" target="_blank">${d.label}</a></li>`)
      .join('');
    const zipHtml = site.zip
      ? `<a class="iw-zip" href="${site.zip}" download>一式ZIPをダウンロード</a>`
      : '';
    return `
      <div class="iw">
        <div class="iw-photo" style="background-image: url('${site.photo}');"></div>
        <div class="iw-body">
          <div class="iw-title">${site.title}</div>
          <div class="iw-sub">${site.subtitle}</div>
          <dl class="iw-facts">${factsHtml}</dl>
          <div class="iw-docs-label">DOCUMENTS</div>
          <ul class="iw-docs">${docsHtml}</ul>
          ${zipHtml}
        </div>
      </div>
    `;
  }

  function renderSidebar() {
    const list = document.getElementById('site-list');
    list.innerHTML = sites.map((s, i) => `
      <div class="site-card" data-id="${s.id}" onclick="openSite('${s.id}')">
        <span class="num">${i + 1}</span>
        <span class="title">${s.title}</span>
        <div class="meta">${s.subtitle}</div>
        <span class="status">${s.status}</span>
      </div>
    `).join('');
  }

  // ライトテーマ（la CASA アイボリー基調）
  const darkMapStyle = [
    { elementType: 'geometry', stylers: [{ color: '#f5f2ea' }] },
    { elementType: 'labels.text.stroke', stylers: [{ color: '#ffffff' }] },
    { elementType: 'labels.text.fill', stylers: [{ color: '#5a544a' }] },
    { featureType: 'administrative.locality', elementType: 'labels.text.fill', stylers: [{ color: '#8c6f2a' }] },
    { featureType: 'poi', elementType: 'labels.text.fill', stylers: [{ color: '#7a7468' }] },
    { featureType: 'poi.park', elementType: 'geometry', stylers: [{ color: '#dce8d4' }] },
    { featureType: 'poi.park', elementType: 'labels.text.fill', stylers: [{ color: '#5e7a58' }] },
    { featureType: 'road', elementType: 'geometry', stylers: [{ color: '#ffffff' }] },
    { featureType: 'road', elementType: 'geometry.stroke', stylers: [{ color: '#e5e1d6' }] },
    { featureType: 'road', elementType: 'labels.text.fill', stylers: [{ color: '#5a544a' }] },
    { featureType: 'road.highway', elementType: 'geometry', stylers: [{ color: '#fff4d9' }] },
    { featureType: 'road.highway', elementType: 'geometry.stroke', stylers: [{ color: '#b8944a' }] },
    { featureType: 'transit', elementType: 'geometry', stylers: [{ color: '#ece7db' }] },
    { featureType: 'transit.station', elementType: 'labels.text.fill', stylers: [{ color: '#8c6f2a' }] },
    { featureType: 'water', elementType: 'geometry', stylers: [{ color: '#cfe0ec' }] },
    { featureType: 'water', elementType: 'labels.text.fill', stylers: [{ color: '#4a6fa5' }] },
  ];
</script>

  src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAblGtLUEhqN6raMa1thk4yX1ZFwNw_3V4&callback=initMap&language=ja&region=JP">
</script>
